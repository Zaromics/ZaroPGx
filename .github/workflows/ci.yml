name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    # Same Ubuntu LTS as production (zimerguz). Move CI when zimerguz moves.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # setup-uv has published only full-version tags since v8 (immutable releases):
      # there is no @v10 to float on, so every job pins the exact release.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # The full dependency set needs pysam, which has no wheel for every
      # platform and is irrelevant to formatting. Install just the tools.
      # Pinned to uv.lock's black/isort/flake8 (tests/test_ci_lint_pins.py enforces
      # it), the versions `uv sync --all-extras --dev` gives a developer. flake8's own
      # plugins (pyflakes, pycodestyle) still float within its ranges.
      - name: Install lint tools
        run: uv tool install black==26.10.0 && uv tool install isort==9.0.2 && uv tool install flake8==7.4.1

      - name: black
        run: uv tool run black --check app tests

      - name: isort
        run: uv tool run isort --check-only --profile black app tests

      # Deliberately a narrow gate. Full flake8 still reports many style findings
      # (mostly E501); keep the blocking select tight. F821 NameErrors cleared in
      # Wave 3 — F82 is now part of the blocking gate.
      - name: flake8 (syntax errors, broken asserts, undefined names)
        run: uv tool run flake8 --select=E9,F63,F7,F82 app tests

      # Informational only. Use `|| true` (not continue-on-error) so a non-zero
      # flake8 exit does not create a red ##[error] annotation on a green job.
      - name: flake8 (full, informational)
        run: uv tool run flake8 app tests || true

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Pins the Node guarantee that tests/test_ui_workflow_flag_reads.py's two
      # skipif(shutil.which("node") is None) tests currently get only by luck
      # (the runner image happens to ship Node). Without this step they skip silently.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fast suite: unit/API tests on in-memory SQLite (tests/conftest.py).
      # Full-stack compose e2e lives in the separate `e2e` job (-m e2e).
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: pytest
        run: uv run pytest -q -m "not e2e"

  e2e:
    name: E2E (compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # actions: write required so buildx can write type=gha cache entries
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Bring up e2e stack
        run: ./scripts/e2e-up.sh

      - name: Run e2e tests
        env:
          ZAROPGX_E2E: "1"
          ZAROPGX_E2E_BASE_URL: http://127.0.0.1:18765
        run: uv run pytest -m e2e -q --tb=short --zaropgx-e2e

      - name: Dump logs on failure
        if: failure()
        run: |
          mkdir -p e2e-logs
          docker compose --env-file .env.e2e -p zaropgx_e2e -f compose.yml -f compose.e2e.yml logs --no-color > e2e-logs/compose.log || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs
          path: e2e-logs/

      - name: Tear down
        if: always()
        run: ./scripts/e2e-down.sh
