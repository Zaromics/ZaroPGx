name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    # Same Ubuntu LTS as production (zimerguz). Move CI when zimerguz moves.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # setup-uv has published only full-version tags since v8 (immutable releases):
      # there is no @v10 to float on, so every job pins the exact release.
      # `version` pins uv itself (setup-uv otherwise installs the newest), the same uv
      # the images copy and pyproject.toml's required-version names
      # (tests/test_dockerfile_uv_pin.py keeps the three together).
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true

      # The full dependency set needs pysam, which has no wheel for every
      # platform and is irrelevant to formatting. Install just the tools.
      # Pinned to uv.lock's black/isort/flake8 (tests/test_ci_lint_pins.py enforces
      # it), the versions `uv sync --all-extras --dev` gives a developer. flake8's own
      # plugins (pyflakes, pycodestyle) still float within its ranges.
      - name: Install lint tools
        run: uv tool install black==26.10.0 && uv tool install isort==9.0.2 && uv tool install flake8==7.4.1

      - name: black
        run: uv tool run black --check app tests

      - name: isort
        run: uv tool run isort --check-only --profile black app tests

      # Deliberately a narrow gate. Full flake8 still reports many style findings
      # (mostly E501); keep the blocking select tight. F821 NameErrors cleared in
      # Wave 3 — F82 is now part of the blocking gate.
      - name: flake8 (syntax errors, broken asserts, undefined names)
        run: uv tool run flake8 --select=E9,F63,F7,F82 app tests

      # Informational only. Use `|| true` (not continue-on-error) so a non-zero
      # flake8 exit does not create a red ##[error] annotation on a green job.
      - name: flake8 (full, informational)
        run: uv tool run flake8 app tests || true

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Pins the Node guarantee that the tests running index.html's script in Node
      # (tests/test_ui_workflow_flag_reads.py, tests/test_ui_fhir_push_button.py;
      # skipif(shutil.which("node") is None)) currently get only by luck (the
      # runner image happens to ship Node). Without this step they skip silently.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # WeasyPrint's native libraries, so tests/test_weasyprint_real_render.py
      # renders with the real engine instead of skipping. fonts-liberation is
      # the app image's Arial (Dockerfile): the PDF page-layout tests
      # (tests/test_report_first_page_fits.py, ...) measure where text falls,
      # so they render with the font production renders with.
      - name: Install Pango
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation

      # Fast suite: unit/API tests on a throwaway PostgreSQL container started by
      # tests/postgres.py from db/init, as production is.
      # Full-stack compose e2e lives in the separate `e2e` job (-m e2e).
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: pytest
        run: uv run pytest -q -m "not e2e"

  e2e:
    name: E2E (compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # actions: write required so buildx can write type=gha cache entries
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # tests/e2e/test_ui_smoke.py drives the page in Chromium. Its headless build is
      # all it launches (--only-shell); --with-deps adds the system libraries.
      - name: Install Playwright's Chromium
        run: uv run playwright install --with-deps --only-shell chromium

      # PharmCAT's preprocessor needs its GRCh38 reference (reference.fna.bgz, 844 MB).
      # The pharmcat container downloaded it from Zenodo at startup into an empty
      # volume, every run: 31 PRs pushed at once ran some 60 of those downloads
      # together, Zenodo throttled them past pharmcat's 20-minute health start period,
      # and nearly every E2E run failed before a test ran. Kept in the Actions cache
      # and bound into the stack (compose.e2e.yml), it comes from Zenodo only on a
      # cache miss. Saved in its own step, so a run that fails later still keeps it.
      - name: Restore the PharmCAT reference
        id: pharmcat-reference
        uses: actions/cache/restore@v6
        with:
          path: .cache/pharmcat-reference
          key: pharmcat-reference-zenodo-7288118

      - name: Download the PharmCAT reference (cache miss)
        if: steps.pharmcat-reference.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/pharmcat-reference
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 30 \
            -o "$RUNNER_TEMP/GRCh38_reference_fasta.tar" \
            https://zenodo.org/record/7288118/files/GRCh38_reference_fasta.tar
          # The SHA-256 genome-downloader and the pharmcat image pin it by.
          echo "7aeb9c9b7ddb262aab32fe97a48317a4a54d97680dea27b81af4561cf502f839  $RUNNER_TEMP/GRCh38_reference_fasta.tar" \
            | sha256sum -c -
          tar -xf "$RUNNER_TEMP/GRCh38_reference_fasta.tar" -C .cache/pharmcat-reference
          gzip -t .cache/pharmcat-reference/reference.fna.bgz
          ls -l .cache/pharmcat-reference

      - name: Save the PharmCAT reference
        if: steps.pharmcat-reference.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/pharmcat-reference
          key: pharmcat-reference-zenodo-7288118

      - name: Bring up e2e stack
        env:
          E2E_PHARMCAT_REFERENCE: ./.cache/pharmcat-reference
        run: ./scripts/e2e-up.sh

      - name: Run e2e tests
        env:
          ZAROPGX_E2E: "1"
          ZAROPGX_E2E_BASE_URL: http://127.0.0.1:18765
        run: uv run pytest -m e2e -q --tb=short --zaropgx-e2e

      - name: Dump logs on failure
        if: failure()
        run: |
          mkdir -p e2e-logs
          docker compose --env-file .env.e2e -p zaropgx_e2e -f compose.yml -f compose.e2e.yml logs --no-color > e2e-logs/compose.log || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs
          path: e2e-logs/

      - name: Tear down
        if: always()
        run: ./scripts/e2e-down.sh
