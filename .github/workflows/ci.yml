name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The full dependency set needs pysam, which has no wheel for every
      # platform and is irrelevant to formatting. Install just the tools.
      - name: Install lint tools
        run: uv tool install black && uv tool install isort && uv tool install flake8

      - name: black
        run: uv tool run black --check app tests

      - name: isort
        run: uv tool run isort --check-only --profile black app tests

      # Deliberately a narrow gate. A full flake8 run currently reports ~1900
      # findings (mostly E501) and there are 18 genuine F821 undefined names in
      # app/main.py and app/reports/generator.py. Those are tracked as Wave 3
      # work in dev-notes/BACKLOG.md; add F82 to this select once they are gone,
      # then widen further. A gate that cannot pass is a gate nobody reads.
      - name: flake8 (syntax errors and broken asserts only)
        run: uv tool run flake8 --select=E9,F63,F7 app tests

      - name: flake8 (full, informational)
        continue-on-error: true
        run: uv tool run flake8 app tests

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Fast suite: unit/API tests on in-memory SQLite (tests/conftest.py).
      # Full-stack compose e2e lives in the separate `e2e` job (-m e2e).
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: pytest
        run: uv run pytest -q -m "not e2e"

  e2e:
    name: E2E (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # actions: write required so buildx can write type=gha cache entries
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Bring up e2e stack
        run: ./scripts/e2e-up.sh

      - name: Run e2e tests
        env:
          ZAROPGX_E2E: "1"
          ZAROPGX_E2E_BASE_URL: http://127.0.0.1:18765
        run: uv run pytest -m e2e -q --tb=short

      - name: Dump logs on failure
        if: failure()
        run: |
          mkdir -p e2e-logs
          docker compose --env-file .env.e2e -p zaropgx_e2e logs --no-color > e2e-logs/compose.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: e2e-logs/

      - name: Tear down
        if: always()
        run: ./scripts/e2e-down.sh
