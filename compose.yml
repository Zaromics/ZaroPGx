
name: zaropgx
services:
  # ~~~~~~~~~~MAIN APP~~~~~~~~~~
  app:
    # Default: pull the published image. Fallback: `docker compose build` builds locally.
    image: zaromicsresearch/zaropgx-app:${ZAROPGX_TAG:-0.4.0}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgx_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pharmcat:
        condition: service_healthy
    # Behavioural config (toggles, tuning, secrets) comes from .env. Compose
    # environment: below is topology only, plus ${VAR:-default} for keys that
    # appear in both. Requires Docker Compose >= 2.24 for path/required form.
    env_file:
      - path: .env
        required: false
    environment:
      # Topology — must not be overridable from .env (wrong hostnames break the stack)
      - DATABASE_URL=postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - PHARMCAT_API_URL=http://pharmcat:5000
      - PHARMCAT_JAR_PATH=/pharmcat/pharmcat.jar
      - GATK_API_URL=http://gatk-api:5000
      - PYPGX_API_URL=http://pypgx:5000
      - GENOME_DOWNLOADER_API_URL=http://genome-downloader:5050
      - NEXTFLOW_RUNNER_URL=${NEXTFLOW_RUNNER_URL:-http://nextflow:5055}
      - FHIR_SERVER_URL=http://fhir-server:8080/fhir
      - KROKI_URL=http://kroki:8000
      - SOURCE_URL=${SOURCE_URL:-https://github.com/Zaromics/ZaroPGx}
      - FHIR_EXPORT_ENABLED=${FHIR_EXPORT_ENABLED:-true}
      - PYTHONPATH=/app
      - JOB_API_BASE=http://app:8000/api/v1
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - ZAROPGX_AUTH_MODE=${ZAROPGX_AUTH_MODE:-open}
      # The FASTQ size cap: the app plans uploads against it and gatk-api enforces it,
      # so both are handed this one value (see gatk-api below).
      - FASTQ_MAX_UPLOAD_BYTES=${FASTQ_MAX_UPLOAD_BYTES:-21474836480}
      # INCLUDE_PHARMCAT_* and EXECSUM_USE_TSV come from env_file/.env only
    volumes:
      - ./:/app
      - ./data:/data
      - ./scripts:/scripts:ro
    ports:
      # Loopback unless .env says otherwise (BIND_ADDRESS in the .env templates).
      - "${BIND_ADDRESS:-127.0.0.1:8765}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pgx-network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
  
  
  # PostgreSQL Database
  db:
    # Pinned to the minor: 18.x updates are in-place (no pg_upgrade), but a floating
    # tag changes the server under a live volume on any pull.
    image: postgres:18.6
    container_name: pgx_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-zaropgx_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - run ./start-docker.sh or set it in .env}
      POSTGRES_DB: ${DB_NAME:-zaropgx_db}
    volumes:
      # PG18+ stores data in a major-version subdir and rejects a mount at
      # /var/lib/postgresql/data; mount the volume at the postgres home instead.
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zaropgx_user} -d ${DB_NAME:-zaropgx_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pgx-network


  # Reference material downloader service
  genome-downloader:
    image: zaromicsresearch/zaropgx-genome-downloader:${ZAROPGX_TAG:-0.4.0}
    platform: linux/amd64
    build:
      context: ./docker/genome-downloader
      dockerfile: Dockerfile.downloader
    container_name: pgx_genome_downloader
    restart: unless-stopped
    volumes:
      - ./reference:/reference
    environment:
      - DOWNLOAD_ON_STARTUP=${DOWNLOAD_ON_STARTUP:-true}
      # The CRAM reference cache (/reference/ref_cache, REF_PATH below): 3.2 GB
      # fetched, 5.3 GB kept. Off only where no CRAM is read (compose.e2e.yml).
      - REF_CACHE_ENABLED=${REF_CACHE_ENABLED:-true}
      # Same pin as the pharmcat service below, and it has to stay the same: this
      # service fetches pharmcat_positions.vcf, which gatk-api's /gvcf-to-vcf uses as
      # its interval list, and that file is version-specific. A mismatch emits a gVCF
      # upload's reference calls at one PharmCAT release's positions while PharmCAT
      # genotypes another's -- which shows up as no-calls, not as an error. NOTE that
      # bumping this alone does NOT re-stage an existing ./reference tree: the
      # downloader short-circuits on /reference/.download_complete. Delete that file to
      # force a re-fetch after a PharmCAT bump.
      - PHARMCAT_VERSION=${PHARMCAT_VERSION:-3.4.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:5050:5050"
    networks:
      - pgx-network


  # PharmCAT Service Wrapper - combines JAR and API
  pharmcat:
    image: zaromicsresearch/zaropgx-pharmcat:${ZAROPGX_TAG:-0.4.0}
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/pharmcat/Dockerfile
      args:
        PHARMCAT_VERSION: ${PHARMCAT_VERSION:-3.4.0}
    container_name: pgx_pharmcat
    restart: unless-stopped
    volumes:
      - ./data:/data
      # Reference genome cache ONLY — must not mask /pharmcat or image upgrades
      # are frozen under the old pipeline binary. start.sh links refs into /pharmcat.
      - pharmcat-references:/pharmcat-references
    ports:
      # FastAPI
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:5001:5000"
    environment:
      - DATA_DIR=/data
      - JAVA_OPTS=${JAVA_OPTS:--Xmx4g}
      - PHARMCAT_LOG_LEVEL=${PHARMCAT_LOG_LEVEL:-DEBUG}
      - PHARMCAT_VERSION=${PHARMCAT_VERSION:-3.4.0}
      - PHARMCAT_REF_CACHE=/pharmcat-references
      - PHARMCAT_REFERENCE_DIR=/pharmcat
      - PHARMCAT_TEE=true
      - PHARMCAT_ABSENT_TO_REF=${PHARMCAT_ABSENT_TO_REF:-false}
      - PHARMCAT_UNSPECIFIED_TO_REF=${PHARMCAT_UNSPECIFIED_TO_REF:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First run downloads the GRCh38 reference (~8-15 min). Don't mark unhealthy before
      # then, or app's `depends_on: pharmcat: service_healthy` blocks the whole stack.
      start_period: 1200s
    networks:
      - pgx-network


  # HAPI FHIR Server for EHR/PHR/EMR integration
  # Pinned (not :latest) — this service owns a live Postgres schema shared with the
  # rest of the stack, and point releases have shipped non-zero-downtime migrations.
  # Bump ${HAPI_FHIR_TAG} deliberately: its schema migration runs on first boot.
  fhir-server:
    image: hapiproject/hapi:${HAPI_FHIR_TAG:-v8.12.0-2}
    container_name: pgx_fhir_server
    restart: unless-stopped
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8090:8080"
    environment:
      - hapi.fhir.allow_external_references=true
      - hapi.fhir.allow_multiple_delete=true
      - hapi.fhir.reuse_cached_search_results_millis=60000
      - spring.datasource.url=jdbc:postgresql://db:5432/${DB_NAME:-zaropgx_db}?currentSchema=fhir
      - spring.datasource.username=${DB_USER:-zaropgx_user}
      - spring.datasource.password=${DB_PASSWORD:?DB_PASSWORD is not set - run ./start-docker.sh or set it in .env}
      - spring.datasource.driverClassName=org.postgresql.Driver
      - spring.jpa.properties.hibernate.dialect=ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      - spring.jpa.hibernate.ddl-auto=update
      - spring.jpa.properties.hibernate.default_schema=fhir
      - hapi.fhir.jpa.database_schema=update
      - hapi.fhir.jpa.auto_create_tables=true
      - hapi.fhir.jpa.database_schema_auto_create=true
      - hapi.fhir.jpa.database_schema_auto_validate=true
      - hapi.fhir.jpa.disable_temporary_table_creation=true
      - spring.jpa.open-in-view=false
      - hapi.fhir.max_page_size=50
      - hapi.fhir.default_page_size=20
      - hapi.fhir.subscription.resthook_enabled=true
      - hapi.fhir.subscription.websocket_enabled=false
      - JAVA_OPTS=-Djava.io.tmpdir=/tmp -Xmx2g
      - SPRING_DATASOURCE_INITIALIZATION_MODE=always
      # The HL7 Genomics Reporting IG 3.0.0, whose profiles the FHIR export follows, so
      # that $validate checks a bundle against them. Installed from the pinned files in
      # docker/fhir-server/packages (mounted below), never fetched: fetchDependencies is
      # off, and the two packages the IG depends on are listed after it, at the versions
      # it names. The IG is installed as resources, so its profiles can be searched; its
      # dependencies are only stored, where the validator looks them up. Each package
      # installs on the first start whose database lacks it and is skipped after that.
      - hapi.fhir.implementationguides.genomics.name=hl7.fhir.uv.genomics-reporting
      - hapi.fhir.implementationguides.genomics.version=3.0.0
      - hapi.fhir.implementationguides.genomics.packageUrl=file:///fhir-packages/hl7.fhir.uv.genomics-reporting-3.0.0.tgz
      - hapi.fhir.implementationguides.genomics.installMode=STORE_AND_INSTALL
      - hapi.fhir.implementationguides.genomics.fetchDependencies=false
      - hapi.fhir.implementationguides.genomics.reloadExisting=false
      - hapi.fhir.implementationguides.terminology.name=hl7.terminology.r4
      - hapi.fhir.implementationguides.terminology.version=6.1.0
      - hapi.fhir.implementationguides.terminology.packageUrl=file:///fhir-packages/hl7.terminology.r4-6.1.0.tgz
      - hapi.fhir.implementationguides.terminology.installMode=STORE_ONLY
      - hapi.fhir.implementationguides.extensions.name=hl7.fhir.uv.extensions.r4
      - hapi.fhir.implementationguides.extensions.version=5.1.0
      - hapi.fhir.implementationguides.extensions.packageUrl=file:///fhir-packages/hl7.fhir.uv.extensions.r4-5.1.0.tgz
      - hapi.fhir.implementationguides.extensions.installMode=STORE_ONLY
      # HAPI pre-expands stored value sets in the background, which needs a search index
      # (Hibernate Search) this server does not keep: it failed on every value set of the
      # IG, logging some 85 errors on the first start. Validation expands what it needs.
      - hapi.fhir.enable_task_pre_expand_value_sets=false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/fhir-data:/data/hapi
      - ./docker/fhir-server/packages:/fhir-packages:ro
    # No healthcheck: the hapi image is distroless (no shell, curl or wget), so the
    # `curl` check this had could never run and the service always read "unhealthy".
    # Nothing waits on its health.
    healthcheck:
      disable: true
    networks:
      - pgx-network


  # GATK Service Wrapper
  gatk-api:
    image: zaromicsresearch/zaropgx-gatk-api:${ZAROPGX_TAG:-0.4.0}
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/gatk-api/Dockerfile.gatk-api
    container_name: pgx_gatk_api
    restart: unless-stopped
    depends_on:
      genome-downloader:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./reference:/reference
      # The FASTQ lane's reference + GATK bwa-mem index image (~8 GB). Host-side
      # because PyPGx's no-ALT-except-GSTT1 rule disqualifies every prebuilt index,
      # so it is built once by scripts/build-align-index.sh rather than baked in.
      - ${ZAROPGX_ALIGN_REFERENCE:-./reference/pypgx}:/reference/pypgx:ro
    environment:
      # Decoding a CRAM without a FASTA for a contig, htslib looks the sequence up
      # by MD5 in REF_PATH, and some htslib versions default that to EBI's server.
      # Measured 2026-10-06 on NA12878's CRAM: the mtdna image (htslib 1.19.1)
      # fetched chrM from EBI by itself; gatk-api and zarohla (1.24) did not. A
      # local-only REF_PATH -- no URL in it -- makes it a decode error instead, on
      # every service that reads alignments, whatever its htslib. The path is the
      # reference cache the genome downloader fills, by MD5, with UCSC hg38 and the
      # 1000 Genomes GRCh38 analysis set (decoys, HLA): /cram-to-bam decodes through
      # it when it holds every contig with reads, so a CRAM written against either
      # build reads with its own sequences.
      # tests/test_no_external_service_defaults.py pins it.
      - REF_PATH=/reference/ref_cache/%2s/%2s/%s
      - REFERENCE_DIR=/reference
      - DATA_DIR=/data
      - ALIGN_REFERENCE=/reference/pypgx/pypgx_grch38.fasta
      - MAX_MEMORY=${MAX_MEMORY:-20g}
      # The same value the app plans FASTQ uploads against (20 GiB unless .env sets
      # it); a mismatch would accept an upload this service then refuses.
      - FASTQ_MAX_UPLOAD_BYTES=${FASTQ_MAX_UPLOAD_BYTES:-21474836480}
      # Selects the pin /gvcf-to-vcf checks PharmCAT's position list against; the
      # same value genome-downloader fetches that list for.
      - PHARMCAT_VERSION=${PHARMCAT_VERSION:-3.4.0}
      - PYTHONPATH=/app
      - UVICORN_RELOAD_EXCLUDES=".git/*,.venv/*"
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:5002:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - pgx-network
    deploy:
      resources:
        limits:
          memory: 28G


  # PyPGx Service Wrapper
  pypgx:
    image: zaromicsresearch/zaropgx-pypgx:${ZAROPGX_TAG:-0.4.0}
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/pypgx/Dockerfile.pypgx
    container_name: pgx_pypgx
    restart: unless-stopped
    depends_on:
      genome-downloader:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./reference:/reference
      - ./config:/app/config
    environment:
      # Local-only, never EBI: see gatk-api.
      - REF_PATH=/reference/ref_cache/%2s/%2s/%s
      - DATA_DIR=/data
      - REFERENCE_DIR=/reference
      - PYPGX_MEMORY_LIMIT=${PYPGX_MEMORY_LIMIT:-7G}
      - PYPGX_MAX_PARALLEL_GENES=${PYPGX_MAX_PARALLEL_GENES:-8}
      - PYPGX_BATCH_SIZE=${PYPGX_BATCH_SIZE:-4}
      - PYPGX_PHARMCAT_PREFERENCE=${PYPGX_PHARMCAT_PREFERENCE:-pharmcat}  # auto|pypgx|pharmcat
      # Where the reads of CYP2D6 and UGT2B17/UGT2B15 are aligned again when an
      # alignment put some on GRCh38's ALT contigs (realign_alt_loci). Not a
      # dependency: without gatk-api, or its index image, the step goes on without
      # it and the report says so.
      - GATK_API_URL=http://gatk-api:5000
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:5053:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - pgx-network
    deploy:
      resources:
        limits:
          memory: 20G
        reservations:
          memory: 7G


  # ZaroHLA — OptiType v1.5 HLA Class I typing service.
  # ACTIVE HLA path, but only the Nextflow pipeline actually types with it: the
  # POST /call-hla calls live solely in pipelines/pgx/main.nf (gated on
  # OPTITYPE_ENABLED). app/ touches http://zarohla:5000 for /health probes, the
  # services-status listing, and the broadcast /cancel in job_router — it never
  # submits an HLA job itself. Do not prune this service on the strength of the
  # app's references alone.
  zarohla:
    image: zaromicsresearch/zaropgx-zarohla:${ZAROPGX_TAG:-0.4.0}
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/zarohla/Dockerfile
    container_name: pgx_zarohla
    restart: unless-stopped
    environment:
      # Local-only, never EBI: see gatk-api.
      - REF_PATH=/reference/ref_cache/%2s/%2s/%s
      - DATA_DIR=/data
      - JOB_API_BASE=http://app:8000/api/v1
      # The BAM->FASTQ conversion is the biggest write in the stack (a whole WGS
      # alignment becomes tens of GB of FASTQ that OptiType reads once and
      # discards). Keeping it off ./data lets a host put it on a larger disk --
      # set ZAROPGX_SCRATCH. Unset, it resolves to ./data/temp as before.
      - HLA_TEMP_DIR=/scratch
      - ZAROHLA_SAMTOOLS_THREADS=${ZAROHLA_SAMTOOLS_THREADS:-4}
    volumes:
      - ./data:/data
      - ${ZAROPGX_SCRATCH:-./data/temp}:/scratch
      # For REF_PATH above: without it the reference cache it names was not there, and
      # a CRAM posted here could not be decoded. Read-only; zarohla writes none of it.
      - ./reference:/reference:ro
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:5060:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pgx-network

  # mtDNA-Server 2 (mutserve + haplogrep3 + haplocheck), wrapped in a ZaroPGx
  # HTTP sidecar. Built FROM the upstream pipeline's own image; it does NOT run
  # upstream's Nextflow pipeline -- that needs a mounted Docker socket, the
  # thing that got the hlatyping service below disabled.
  mtdna:
    image: zaromicsresearch/zaropgx-mtdna:${ZAROPGX_TAG:-0.4.0}
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/mtdna-server-2/Dockerfile
    container_name: pgx_mtdna
    restart: unless-stopped
    environment:
      # Local-only, never EBI: see gatk-api.
      - REF_PATH=/reference/ref_cache/%2s/%2s/%s
      - DATA_DIR=/data
      - JOB_API_BASE=http://app:8000/api/v1
    volumes:
      - ./data:/data
      # Read-only: it needs chain/hg19ToHg38.over.chain.gz for hg19 input, and
      # stages no reference of its own (rCRS is vendored into the image).
      - ./reference:/reference:ro
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:5062:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pgx-network

  # nf-core/hlatyping Wrapper Service (HTTP API running Nextflow) — DISABLED
  # The docker/hlatyping/ build context is missing, so this service cannot build.
  # Kept as a restorable placeholder (alternate HLA path, now with HLA-HD support).
  # To re-enable: restore docker/hlatyping/Dockerfile.hlatyping for nf-core/hlatyping
  # pipeline v2.2.0 (requires Nextflow >= 25.04.2), then uncomment the block below.
  # hlatyping:
  #   build:
  #     context: .
  #     dockerfile: docker/hlatyping/Dockerfile.hlatyping
  #   container_name: pgx_hlatyping
  #   restart: unless-stopped
  #   environment:
  #     - DATA_DIR=/data
  #     - HLATYPING_PROFILE=docker
  #     - HLATYPING_PIPELINE_VERSION=2.2.0
  #     - NXF_OPTS=-Xms1g -Xmx8g
  #   volumes:
  #     - ./data:/data
  #     # Mount host docker socket so Nextflow can launch docker tasks with -profile docker
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ./data/nextflow:/opt/nextflow
  #   ports:
  #     - "5061:5000"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 40s
  #   networks:
  #     - pgx-network


  # Kroki Service for diagram and visual rendering
  kroki:
    image: yuzutech/kroki:0.32.1
    container_name: pgx_kroki
    restart: unless-stopped
    depends_on:
      - mermaid
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8001:8000"
    environment:
      - KROKI_SAFE_MODE=false
      - KROKI_MAX_DURATION=30000
      - KROKI_MAX_SIZE=10485760
      - KROKI_LOG_LEVEL=INFO
      - KROKI_MERMAID_HOST=mermaid
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pgx-network


  mermaid:
    image: yuzutech/kroki-mermaid:0.32.1
    container_name: pgx_kroki_mermaid
    restart: unless-stopped
    command: ["--no-sandbox", "--disable-dev-shm-usage", "--disable-software-rasterizer", "--disable-gpu", "--disable-features=GlobalMediaControls"]
    expose:
      - "8002"
    environment:
      - CHROME_ARGS=--disable-dbus --no-sandbox --disable-dev-shm-usage --disable-gpu
    networks:
      - pgx-network


  # Nextflow executor orchestrating the ZaroPGx pipeline
  nextflow:
    # CORE pipeline orchestrator — the app submits every analysis here (USE_NEXTFLOW=True).
    image: zaromicsresearch/zaropgx-nextflow:${ZAROPGX_TAG:-0.4.0}
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/nextflow/Dockerfile.nextflow
    container_name: pgx_nextflow
    restart: unless-stopped
    environment:
      - NXF_HOME=/opt/nextflow
      - NXF_OPTS=-Xms1g -Xmx4g
      - DB_USER=${DB_USER:-zaropgx_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is not set - run ./start-docker.sh or set it in .env}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-zaropgx_db}
    volumes:
      - ./:/workspace
      - ./data:/data
      - ./reference:/reference
      - ./data/nextflow:/opt/nextflow
      # No Docker socket. Every process in main.nf runs here and calls a service over
      # HTTP; none declares a container, so Nextflow never started one, and the socket
      # only made this container root-equivalent on the host -- the one that runs an
      # unauthenticated POST /run. Rootless Docker has no /var/run/docker.sock at all.
    working_dir: /workspace
    # Deliberately NOT published to the host: runner.py's POST /run is unauthenticated, so
    # a host mapping would let anything that can reach the port start pipelines and shell
    # steps. The app reaches it as http://nextflow:5055 over the compose network.
    expose:
      - "5055"
    networks:
      - pgx-network


  # Sphinx Documentation service (live reload)
  docs:
    # Optional and build-only (the app also serves docs at /docs).
    # Opt in with: docker compose --profile optional up -d
    profiles: ["optional"]
    build:
      context: .
      dockerfile: docker/docs/Dockerfile.docs
    container_name: pgx_docs
    restart: unless-stopped
    volumes:
      - ./docs:/docs
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:5070:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pgx-network


volumes:
  pgdata:
    driver: local
  # Note: fhir-data volume defined but fhir-server uses bind mount ./data/fhir-data
  # Consider using this named volume for production deployments
  fhir-data:
    driver: local
  pharmcat-references:
    driver: local


networks:
  pgx-network:
    name: pgx-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NETWORK_SUBNET:-172.28.0.0/16}