# E2E overlay: only the app is published on the host (BIND_ADDRESS → 18765).
# Sidecars talk over the compose network; publishing their default host ports
# collides with a developer stack or other local listeners (e.g. WSL on 5060).
services:
  app:
    environment:
      # Skip Kroki Mermaid in e2e (Graphviz/Pillow still produce diagrams).
      # Prevents sync Chromium renders from starving /health and GET /jobs.
      - KROKI_ENABLED=false
      - KROKI_TIMEOUT=5
      # The mtdna sidecar is deliberately excluded from e2e's SERVICES list
      # (scripts/e2e-up.sh) and from docker-bake.hcl: its image is built FROM
      # upstream's quay.io/genepi/mtdna-server-2:v2.1.16 and weighs ~4.5 GB,
      # which would exhaust a GitHub Actions runner's disk budget. With the
      # service absent, leaving MTDNA_ENABLED at its app default (true) makes
      # every pipeline run's MtdnaCall step curl a host that never resolves
      # and fail. So: mtDNA is NOT covered by e2e in CI — it is verified
      # locally against the real stack instead.
      - MTDNA_ENABLED=false
  db:
    ports: !reset []
  genome-downloader:
    ports: !reset []
  pharmcat:
    ports: !reset []
  pypgx:
    ports: !reset []
  nextflow:
    ports: !reset []
  zarohla:
    ports: !reset []
  gatk-api:
    ports: !reset []
  kroki:
    ports: !reset []
  docs:
    ports: !reset []
